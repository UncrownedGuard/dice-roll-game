<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dice Roll</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background-color: #1e1e1e;
      color: #dae6f3;
      padding: 20px;
      margin: 0;
      text-align: center;
    }

    .widget {
      max-width: 400px;
      margin: auto;
      background-color: #2c2c2c;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .widget h3 {
      margin-bottom: 20px;
      color: #3d85c6;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    label {
      font-weight: bold;
      width: 100%;
      text-align: left;
    }

    input[type="number"],
    select,
    button {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      border: none;
      border-radius: 5px;
      box-sizing: border-box;
    }

    input[type="number"],
    select {
      background-color: #353c41;
      color: #dae6f3;
      border: 1px solid #0b5394;
    }

    button {
      background-color: #0b5394;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #3d85c6;
      color: #1e1e1e;
    }

    .resultText {
      font-size: 1.2em;
      margin-top: 15px;
    }

    @media (prefers-color-scheme: light) {
      body {
        background-color: #ffffff;
        color: #353c41;
      }

      .widget {
        background-color: #f5f5f5;
      }

      .widget h3 {
        color: #0b5394;
      }

      input[type="number"],
      select {
        background-color: #dae6f3;
        color: #353c41;
        border: 1px solid #3d85c6;
      }

      button {
        background-color: #0b5394;
        color: #ffffff;
      }

      button:hover {
        background-color: #3d85c6;
        color: #1e1e1e;
      }
    }
  </style>
</head>
<body>

  <div class="widget">
    <h3>Dice Roll</h3>
    <form id="diceRollForm">
      <label for="numDice">Number of Dice:</label>
      <input type="number" id="numDice" name="numDice" min="1" max="10" value="1">

      <label for="typeDice">Type of Dice:</label>
      <select id="typeDice" name="typeDice">
        <option value="4">D4</option>
        <option value="6" selected>D6</option>
        <option value="8">D8</option>
        <option value="10">D10</option>
        <option value="12">D12</option>
        <option value="20">D20</option>
      </select>

      <button type="button" onclick="rollDice()">Roll</button>
    </form>

    <div id="diceRollResult" class="resultText"></div>
  </div>

  <script>
    function rollDice() {
      const numDice = parseInt(document.getElementById('numDice').value);
      const typeDice = parseInt(document.getElementById('typeDice').value);

      if (!numDice || !typeDice) return;

      let results = [];
      let total = 0;

      for (let i = 0; i < numDice; i++) {
        const roll = Math.floor(Math.random() * typeDice) + 1;
        results.push(roll);
        total += roll;
      }

      document.getElementById('diceRollResult').innerHTML = `
        <p><strong>Results:</strong> ${results.join(', ')}</p>
        <p><strong>Total:</strong> ${total}</p>
      `;
    }
  </script>

</body>
</html>
